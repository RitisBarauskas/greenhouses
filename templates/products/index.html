<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
</head>
<body>
    <h1>Главная страница</h1>

    <h2>Список продуктов</h2>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} - {{ product.price }} руб. (<a href="{% url 'products:product_detail' product.id %}">подробнее</a>)</li>
        {% endfor %}
    </ul>
</body>
</html>
